name: Publish gh-pages branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build official pack and templates
        run: pnpm pack:build
      - name: Validate Pack Schema
        run: pnpm pack:validate
      - name: Build and verify deterministic analysis
        run: pnpm analysis:build && pnpm analysis:verify
      - name: Simulate all five recipes
        run: pnpm data:simulate
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build static site
        run: pnpm build:app
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: Publish generated site branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PAGES_DIR="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -B gh-pages "$PAGES_DIR" origin/gh-pages
          else
            git worktree add --detach "$PAGES_DIR" HEAD
            git -C "$PAGES_DIR" switch --orphan gh-pages
          fi
          find "$PAGES_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -R dist/. "$PAGES_DIR/"
          touch "$PAGES_DIR/.nojekyll"
          git -C "$PAGES_DIR" add -A
          if [ -n "$(git -C "$PAGES_DIR" status --porcelain)" ]; then
            git -C "$PAGES_DIR" commit -m "deploy: ${GITHUB_SHA::7}"
            git -C "$PAGES_DIR" push origin gh-pages
          fi
      - name: Request GitHub Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
